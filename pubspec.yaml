name: basketbrook_trails
description: "Basketbrook Trails - chicken chain trail runner"
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.3
  audioplayers: ^6.1.0
  connectivity_plus: ^6.1.0
  provider: ^6.1.2
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  appsflyer_sdk: ^6.18.1
  app_tracking_transparency: ^2.0.7
  device_info_plus: ^13.2.0
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  webview_flutter_wkwebview: ^3.26.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.3.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/Basketbrook_Trails_additional_assets/Icon.png"
  adaptive_icon_background: "assets/Basketbrook_Trails_additional_assets/Icon.png"
  adaptive_icon_foreground: "assets/Basketbrook_Trails_additional_assets/icon_transparent.png"
  min_sdk_android: 23

flutter:
  # Force CocoaPods on iOS (both locally and on CI). We ship Firebase via
  # CocoaPods; Flutter's automatic SwiftPM integration in 3.44+ tries to
  # add Firebase as a Swift Package too, which collides with the pod and
  # blows up archive with "Redefinition of module 'Firebase'". Setting
  # this here (checked into the repo) makes Codemagic honour the choice
  # instead of falling back to global SwiftPM enabled.
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - assets/Vertical_Notifications_Screen.webp
    - assets/Horizontal_Notifications_Screen.webp
    - assets/Vertical_Nowifi_Screen.webp
    - assets/Horizontal_Nowifi_Screen.webp
    - assets/Basketbrook_Trails_additional_assets/
    - assets/Basketbrook_Trails_gameplay_assets/
    - assets/Basketbrook_Trails_sounds_assets/
    - assets/sprites/chickens/
    - assets/sprites/eggs/
    - assets/sprites/baskets/
    - assets/sprites/coins/
    - assets/sprites/collectibles/
    - assets/sprites/decorative/
    - assets/sprites/fences/
    - assets/sprites/obstacles/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand.ttf
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
